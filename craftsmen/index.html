<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b46">
<title>المهن والخدمات | 5EDMA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #102b46;
}

header {
    background: #102b46;
    color: white;
    text-align: center;
    padding: 28px 15px;
    border-radius: 0 0 28px 28px;
}

.logo {
    color: #ff9d27;
    font-size: 30px;
    font-weight: bold;
}

header h1 {
    margin: 10px 0;
    font-size: 23px;
}

header p {
    color: #dce7f2;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px 15px;
}

.search {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 15px;
    font-size: 16px;
    margin-bottom: 15px;
    outline-color: #ff9d27;
}

.count {
    color: #777;
    margin: 10px 3px 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px #0000000c;
}

.card h3 {
    margin: 0 0 10px;
    font-size: 19px;
}

.profession {
    color: #e58a16;
    font-weight: bold;
    margin-bottom: 8px;
}

.info {
    color: #666;
    font-size: 14px;
    margin: 7px 0;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.buttons a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 12px 8px;
    border-radius: 12px;
    color: white;
    font-weight: bold;
}

.call {
    background: #102b46;
}

.whatsapp {
    background: #159b55;
}

.message {
    text-align: center;
    color: #777;
    padding: 25px 10px;
}

.category {
    width: 100%;
    text-align: right;
    font-family: Arial, sans-serif;
    color: #102b46;
}
.back-button {
    width: 100%;
    border: 0;
    background: #102b46;
    color: white;
    padding: 14px;
    border-radius: 13px;
    font-size: 16px;
    margin-bottom: 15px;
    cursor: pointer;
}

</style>
</head>

<body>

<header>
    <div class="logo">5EDMA 🛠️</div>
    <h1>المهن والخدمات</h1>
    <p>ابحث عن المعلم المناسب لمنطقتك</p>
</header>

<div class="container">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="ابحث عن معلم أو مهنة أو منطقة..."
    >

    <div id="count" class="count">جاري تحميل المعلمين...</div>

    <div id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mankbdsgolwabyjlhgbq.supabase.co";
const SUPABASE_KEY = "sb_publishable_TyeZfdpFSx0dTmZcZVrGTQ_gaVhF92q";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const SECTION_ID = "877ae885-4a63-4b17-9848-d1c555c1526f";

const list = document.getElementById("list");
const search = document.getElementById("search");
const count = document.getElementById("count");

let craftsmen = [];

function escapeHTML(value) {
    return String(value || "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function cleanPhone(value) {
    return String(value || "").replace(/[^\d+]/g, "");
}


let selectedProfession = null;

function getProfession(person) {
    const original = (person.description || "").split(" - ")[0].trim() || "مهنة أخرى";

    const aliases = {
        "معلم صحي": "سبّاك",
        "كهربجي": "كهربائي",
        "نجار": "نجّار",
        "حداد": "حدّاد",
        "دهان": "دهّان",
        "مبلّط": "فنّي بلاط وسيراميك",
        "فني تكييف وتبريد": "فنّي تكييف وتبريد",
        "فني أجهزة كهربائية": "فنّي صيانة أجهزة كهربائية",
        "فني ألمنيوم": "فنّي ألمنيوم",
        "فني زجاج": "فنّي زجاج",
        "نقل عفش": "نقل أثاث"
    };

    return aliases[original] || original;
}

function showCraftsmen() {
    const term = search.value.trim().toLowerCase();

    if (!selectedProfession) {
        const professions = [
            "سبّاك",
            "كهربائي",
            "نجّار",
            "حدّاد",
            "دهّان",
            "فنّي بلاط وسيراميك",
            "فنّي تكييف وتبريد",
            "فنّي صيانة أجهزة كهربائية",
            "فنّي ألمنيوم",
            "فنّي زجاج",
            "عامل تنظيف",
            "مكافحة حشرات",
            "نقل أثاث",
            "فنّي تمديدات صحية",
            "فنّي أقفال ومفاتيح",
            "فنّي ستالايت",
            "فنّي إنترنت وشبكات",
            "فنّي طاقة شمسية",
            "فنّي سخّانات مياه",
            "فنّي عزل أسطح ورطوبة"
        ];

        const groups = {};
        professions.forEach(function(name) {
            groups[name] = [];
        });

        craftsmen.forEach(function(person) {
            const profession = getProfession(person);
            if (!groups[profession]) groups[profession] = [];
            groups[profession].push(person);
        });

        const names = Object.keys(groups).filter(function(name) {
            return name.toLowerCase().includes(term) ||
                groups[name].some(function(person) {
                    return [person.title, person.area, person.description]
                        .join(" ").toLowerCase().includes(term);
                });
        }).sort();

        count.textContent = "عدد المهن: " + names.length;

        if (names.length === 0) {
            list.innerHTML = '<div class="message">ما لقينا مهن مطابقة للبحث.</div>';
            return;
        }

        list.innerHTML = names.map(function(name) {
            return `
                <button class="card category" data-profession="${escapeHTML(name)}">
                    <h3>🛠️ ${escapeHTML(name)}</h3>
                    <div class="info">عدد المعلمين: ${groups[name].length}</div>
                    <div class="info">اضغط لعرض المعلمين ←</div>
                </button>
            `;
        }).join("");

        return;
    }

    const filtered = craftsmen.filter(function(person) {
        const description = person.description || "";
        const parts = description.split(" - ");
        const profession = getProfession(person);

        if (profession !== selectedProfession) return false;

        const text = [
            person.title,
            profession,
            person.area,
            parts.slice(1).join(" - ")
        ].join(" ").toLowerCase();

        return text.includes(term);
    });

    count.textContent = selectedProfession + " — عدد المعلمين: " + filtered.length;

    if (filtered.length === 0) {
        list.innerHTML = `
            <button class="back-button" data-back>← رجوع إلى المهن</button>
            <div class="message">ما لقينا معلمين مطابقين للبحث.</div>
        `;
        return;
    }

    list.innerHTML = `
        <button class="back-button" data-back>← رجوع إلى المهن</button>
        ${filtered.map(function(person) {
            const description = person.description || "";
            const parts = description.split(" - ");
            const extra = parts.slice(1).join(" - ");
            const phone = cleanPhone(person.phone);
            const whatsapp = cleanPhone(person.whatsapp || person.phone);

            return `
                <div class="card">
                    <h3>${escapeHTML(person.title)}</h3>
                    <div class="profession">🛠️ ${escapeHTML(selectedProfession)}</div>

                    ${person.area ? `
                        <div class="info">📍 المنطقة: ${escapeHTML(person.area)}</div>
                    ` : ""}

                    ${extra ? `
                        <div class="info">${escapeHTML(extra)}</div>
                    ` : ""}

                    <div class="buttons">
                        ${phone ? `
                            <a class="call" href="tel:${escapeHTML(phone)}">📞 اتصال</a>
                        ` : ""}

                        ${whatsapp ? `
                            <a class="whatsapp"
                               href="https://wa.me/${escapeHTML(whatsapp.replace("+", ""))}"
                               target="_blank">واتساب</a>
                        ` : ""}
                    </div>
                </div>
            `;
        }).join("")}
    `;
}

list.addEventListener("click", function(event) {
    const back = event.target.closest("[data-back]");
    if (back) {
        selectedProfession = null;
        search.value = "";
        showCraftsmen();
        return;
    }

    const category = event.target.closest("[data-profession]");
    if (category) {
        selectedProfession = category.dataset.profession;
        search.value = "";
        showCraftsmen();
    }
});

async function loadCraftsmen() {
    const { data, error } = await supabaseClient
        .from("section_items")
        .select("title, description, phone, whatsapp, area, is_active")
        .eq("section_id", SECTION_ID)
        .eq("is_active", true)
        .order("title", { ascending: true });

    if (error) {
        count.textContent = "تعذر تحميل المعلمين.";
        list.innerHTML = `
            <div class="message">
                تأكد من اتصال الإنترنت وصلاحيات عرض البيانات.
            </div>
        `;
        console.error(error);
        return;
    }

    const { data: hiddenRows, error: hiddenError } = await supabaseClient
        .from("hidden_craftsman_professions")
        .select("profession");

    if (hiddenError) {
        count.textContent = "تعذر تحميل إعدادات المهن.";
        list.innerHTML = '<div class="message">حدث خطأ أثناء تحميل المهن.</div>';
        console.error(hiddenError);
        return;
    }

    const hidden = new Set((hiddenRows || []).map(row => row.profession));

    craftsmen = (data || []).filter(person => !hidden.has(getProfession(person)));
    showCraftsmen();
}

search.addEventListener("input", showCraftsmen);

loadCraftsmen();
</script>

</body>
</html>
