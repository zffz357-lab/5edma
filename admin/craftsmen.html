<script>

async function checkAdminAccess() {
    const loginBox = document.getElementById("loginBox");
    const container = document.querySelector(".container");
    const message = document.getElementById("loginMessage");

    async function verifyAdmin(user) {
        const { data, error } = await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();

        if (error) throw error;
        if (!data) {
            await supabaseClient.auth.signOut();
            throw new Error("هذا الحساب ليس لديه صلاحية الإدارة");
        }

        loginBox.style.display = "none";
        container.style.display = "block";
    }

    try {
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) await verifyAdmin(data.session.user);
    } catch (error) {
        message.textContent = error.message;
    }

    document.getElementById("adminLoginBtn").addEventListener("click", async function() {
        const email = document.getElementById("adminEmail").value.trim();
        const password = document.getElementById("adminPassword").value;
        message.textContent = "جاري تسجيل الدخول...";

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            await verifyAdmin(data.user);
        } catch (error) {
            message.textContent = "خطأ: " + error.message;
        }
    });
}

checkAdminAccess();
